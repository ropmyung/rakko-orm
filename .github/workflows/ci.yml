# Modified for Rakko ORM: validate Rakko code, distributions and database migrations.

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-migrations:
    uses: ./.github/workflows/migrations.yml
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-groups --extra asyncpg --extra psycopg
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync pyright rakko examples docs/sphinx_autodoc_typehints.py tests/migrations/test_writer.py
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups --extra asyncpg --extra psycopg
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv build --out-dir dist/release
      - run: uv run --no-sync twine check --strict dist/release/*
