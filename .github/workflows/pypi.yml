name: Release distributions
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build artifacts only, or publish using a configured Trusted Publisher
        type: choice
        options: [build-only, testpypi, pypi]
        default: build-only
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups --extra asyncpg --extra psycopg
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync pyright rakko examples docs/sphinx_autodoc_typehints.py
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv build --out-dir dist/release
      - run: uv run --no-sync twine check --strict dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: inputs.target != 'build-only'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
